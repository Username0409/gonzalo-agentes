<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080C14;--surf:#0F1420;--card:#141B2D;--card2:#1A2235;--brd:#1E2D45;--acc:#00E5A0;--blue:#0EA5E9;--pur:#A855F7;--ora:#F97316;--red:#EF4444;--grn:#10B981;--yel:#F59E0B;--t:#E8F0FE;--t2:#7B8FAD;--t3:#3A4A5E}
html,body{height:100%;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--t);overflow:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:4px}::-webkit-scrollbar-track{background:transparent}
.sy{font-family:'Syne',sans-serif}
#app{display:flex;height:100vh}
#sb{width:236px;background:var(--surf);border-right:1px solid var(--brd);display:flex;flex-direction:column;transition:width .25s;flex-shrink:0;overflow:hidden}
#sb.cls{width:60px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#tb{height:62px;background:var(--surf);border-bottom:1px solid var(--brd);display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0}
#ct{flex:1;overflow-y:auto;padding:20px}
.slogo{padding:18px 14px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;flex-shrink:0;white-space:nowrap;overflow:hidden}
.si{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--t2);font-size:13px;font-weight:500;border:1px solid transparent;white-space:nowrap;overflow:hidden;transition:all .15s;margin-bottom:2px;user-select:none}
.si:hover{background:var(--card2);color:var(--t)}
.si.act{background:rgba(0,229,160,.1);color:var(--acc);border-color:rgba(0,229,160,.15)}
.card{background:var(--card);border:1px solid var(--brd);border-radius:16px}
.card2{background:var(--card2);border:1px solid var(--brd);border-radius:12px}
.bp{background:var(--acc);color:#080C14;border:none;padding:9px 18px;border-radius:10px;font-family:'Outfit',sans-serif;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:opacity .15s}
.bp:hover{opacity:.83}
.bg{background:var(--card2);color:var(--t);border:1px solid var(--brd);padding:9px 18px;border-radius:10px;font-family:'Outfit',sans-serif;font-weight:500;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.bg:hover{border-color:var(--acc);color:var(--acc)}
.inp{background:var(--surf);border:1px solid var(--brd);color:var(--t);padding:9px 13px;border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;width:100%;outline:none}
.inp:focus{border-color:var(--acc)}
.inp::placeholder{color:var(--t3)}
select.inp option{background:var(--card)}
textarea.inp{resize:vertical}
.lbl{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--t2);display:block;margin-bottom:7px;text-transform:uppercase}
.bdg{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;padding:11px 16px;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--t2);border-bottom:1px solid var(--brd)}
.tbl td{padding:13px 16px;font-size:13px;border-bottom:1px solid rgba(30,45,69,.4)}
.tbl tr:hover td{background:rgba(20,27,45,.4)}
.tog{width:40px;height:22px;border-radius:11px;border:none;cursor:pointer;position:relative;flex-shrink:0;transition:background .2s}
.tth{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:3px;transition:left .2s}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(5px)}
.md{background:var(--card);border:1px solid var(--brd);border-radius:20px;padding:28px;width:90%;max-width:520px;max-height:90vh;overflow-y:auto;animation:fu .2s ease}
.cbu{background:var(--acc);color:#080C14;border-radius:18px 18px 4px 18px;padding:9px 14px;max-width:75%;font-size:13px;font-weight:500;margin-left:auto}
.cbb{background:var(--card2);border:1px solid var(--brd);color:var(--t);border-radius:18px 18px 18px 4px;padding:9px 14px;max-width:75%;font-size:13px;white-space:pre-line}
.kpi{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:22px;position:relative;overflow:hidden;transition:transform .2s}
.kpi:hover{transform:translateY(-2px)}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}
.fu{animation:fu .25s ease}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ga{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:14px}
.ndot{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:#EF4444;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700}
</style>
</head>

</div>
